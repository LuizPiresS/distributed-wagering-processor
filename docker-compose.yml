services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ministack:
    image: ministackorg/ministack:latest
    container_name: wagering-ministack
    restart: always
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1

  migration:
    image: distributed-wagering-processor:latest
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/wagering_db
      - AWS_ENDPOINT=http://ministack:4566
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    command: >
      sh -c "bun run scripts/init-queues.ts && bun run scripts/migrate.ts up"

  app:
    image: distributed-wagering-processor:latest
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_started
      migration:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/wagering_db
      - AWS_ENDPOINT=http://ministack:4566
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_WAGER_QUEUE_URL=http://ministack:4566/000000000000/wager-transactions.fifo
      - ENABLE_WORKERS=false
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    image: nginx:alpine
    container_name: wagering-gateway
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
