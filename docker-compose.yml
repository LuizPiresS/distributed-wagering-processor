services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ministack:
    image: ministackorg/ministack:latest
    container_name: wagering-ministack
    restart: always
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  postgres_data:
